<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manchester United · Season</title>
<link rel="icon" href="/manutd/assets/devil.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/manutd/mu.css">
<style>
.troph{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.troph span{display:inline-flex;align-items:center;gap:8px;background:var(--black);color:#fff;padding:8px 12px;font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.troph img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:4px;padding:2px;box-sizing:border-box}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px;margin-bottom:18px}
.facts div{background:var(--tint);padding:12px 14px} .facts .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted)} .facts .v{font-size:15px;margin-top:3px}
.summary{font-size:16px;line-height:1.6;max-width:78ch}
.match{border-top:1px solid var(--rule);padding:18px 0}
.match .head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.match .team{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px} .match .team.r{justify-content:flex-end;text-align:right}
.match .team img.crest{width:36px;height:36px;margin:0}
.match .score{font-weight:300;font-size:38px;line-height:1;text-align:center;white-space:nowrap}
.match .meta{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.match .scorers{font-size:14px;margin-top:10px} .match .note{font-size:14px;color:var(--muted);margin-top:6px;max-width:78ch}
.match .lineup{font-size:13px;margin-top:8px} .match .lineup b{font-weight:600}
.live{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.live{grid-template-columns:1fr}}
.live h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:0 0 6px}
.stats{list-style:none;margin:0;padding:0;font-size:14px} .stats li{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:4px 0;border-bottom:1px solid var(--rule)} .stats li span:first-child{text-align:right} .stats li span:nth-child(2){color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.xi{font-size:13px;line-height:1.5} .xi b{display:block;font-weight:600;margin-top:4px}
.events{font-size:13px;list-style:none;margin:0;padding:0} .events li{padding:3px 0} .events .min{display:inline-block;width:38px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:14px} .pager a{color:var(--ink)}
</style></head><body><div class="wrap">
<header class="mu">
  <a class="brand" href="/manutd/"><img src="/manutd/assets/crest.png" alt="Manchester United crest" width="96" height="97"><h1><small id="eyebrow">Trophy season</small>Manchester<br>United</h1></a>
  <div class="from" id="from">History<span>Season</span></div>
</header>
<nav class="munav" aria-label="Sections"></nav>

<div class="sheet">
  <h2 id="h">Season</h2>
  <div class="troph" id="troph"></div>
  <div class="facts" id="facts"></div>
  <p class="summary" id="summary"></p>
</div>
<div class="sheet">
  <h2>The matches that decided it</h2>
  <div id="matches"></div>
  <div class="pager" id="pager"></div>
</div>
<footer class="mu">Scores, scorers and line-ups from the club's and competitions' records. For matches from 2010 onwards, line-ups, statistics and events are read from API-Football where it holds them. <a href="/manutd/history/">All honours</a></footer>
</div>
<script src="/manutd/mu.js"></script>
<script>
(function(){
  MU.nav("History");
  var id=new URLSearchParams(location.search).get("s"), $=function(i){return document.getElementById(i)};
  var TLOGO={"Premier League":"premier-league","First Division":"premier-league","FA Cup":"fa-cup","League Cup":"league-cup-carabao","Champions League":"champions-league","European Cup":"champions-league"};
  function tro(t){var l=TLOGO[t]; return '<span>'+(l?'<img src="/manutd/assets/comps/'+l+'.png" alt="">':'')+MU.esc(t)+'</span>'}
  function crest(n){return MU.crest(n,36)||'<span class="crest" style="display:inline-block;width:36px;height:36px"></span>'}
  fetch("/manutd/history/seasons.json").then(function(r){return r.json()}).then(function(all){
    var i=all.findIndex(function(x){return x.id===id}); if(i<0){i=all.length-1} var S=all[i];
    document.title="Manchester United · "+S.title;
    $("eyebrow").textContent=S.trophies.join(" · "); $("h").textContent=S.title; $("from").innerHTML="History<span>"+MU.esc(S.title)+"</span>";
    $("troph").innerHTML=S.trophies.map(tro).join("");
    $("facts").innerHTML=[["Manager",S.manager],["Captain",S.captain],["League",S.league],["Top scorer",S.scorer]].map(function(f){return '<div><div class="k">'+f[0]+'</div><div class="v">'+MU.esc(f[1])+'</div></div>'}).join("");
    $("summary").textContent=S.summary;
    $("matches").innerHTML=S.matches.map(function(m,k){return '<div class="match" id="m'+k+'"><div class="head"><div class="team r">'+MU.esc(m.home)+crest(m.home)+'</div><div><div class="score">'+m.score+'</div><div class="meta">'+MU.esc(m.comp)+' · '+MU.fmtDate(m.date+"T12:00:00Z",{year:"numeric"})+' · '+MU.esc(m.venue)+'</div></div><div class="team">'+crest(m.away)+MU.esc(m.away)+'</div></div>'+
      '<div class="scorers"><b>Scorers</b> '+MU.esc(m.scorers)+'</div>'+(m.lineup?'<div class="lineup"><b>United</b> '+MU.esc(m.lineup)+'</div>':'')+(m.note?'<div class="note">'+MU.esc(m.note)+'</div>':'')+(m.api?'<div class="live" id="live'+k+'"><small>Loading match data…</small></div>':'')+'</div>'}).join("");
    var prev=all[i-1], next=all[i+1];
    $("pager").innerHTML=(prev?'<a href="?s='+prev.id+'">← '+prev.title+' · '+prev.trophies.join(", ")+'</a>':'<span></span>')+(next?'<a href="?s='+next.id+'">'+next.title+' · '+next.trophies.join(", ")+' →</a>':'<span></span>');
    S.matches.forEach(function(m,k){ if(m.api) liveStats(m,k) });
  });
  function liveStats(m,k){
    var box=$("live"+k);
    MU.api("season-fixtures",{season:m.api.season}).then(function(j){
      var fx=j.response.filter(function(x){return x.fixture.date.slice(0,10)===m.date})[0];
      if(!fx){box.innerHTML="";return}
      var fid=fx.fixture.id;
      return Promise.all([MU.api("fixture-stats",{fixture:fid}).catch(function(){return null}),MU.api("lineups",{fixture:fid}).catch(function(){return null}),MU.api("events",{fixture:fid}).catch(function(){return null})]).then(function(r){
        var st=r[0]&&r[0].response, lu=r[1]&&r[1].response, ev=r[2]&&r[2].response, html="";
        if(st&&st.length===2){
          var want=["Ball Possession","Total Shots","Shots on Goal","Corner Kicks","Fouls","Yellow Cards","Red Cards","Passes %"];
          var get=function(t,n){var s=(t.statistics||[]).filter(function(x){return x.type===n})[0]; return s&&s.value!=null?s.value:"–"};
          html+='<div><h4>'+MU.esc(st[0].team.name)+' · '+MU.esc(st[1].team.name)+'</h4><ul class="stats">'+want.map(function(n){var a=get(st[0],n),b=get(st[1],n); if(a==="–"&&b==="–")return ""; return '<li><span>'+a+'</span><span>'+n.replace("Ball ","").replace(" Kicks","s")+'</span><span>'+b+'</span></li>'}).join("")+'</ul></div>';
        }
        if(lu&&lu.length){
          html+='<div><h4>Line-ups</h4><div class="xi">'+lu.map(function(t){return '<b>'+MU.esc(t.team.name)+(t.formation?' · '+t.formation:'')+(t.coach&&t.coach.name?' · '+MU.esc(t.coach.name):'')+'</b>'+t.startXI.map(function(p){return MU.esc(p.player.name)}).join(", ")+(t.substitutes&&t.substitutes.length?'<br><span style="color:var(--muted)">Bench: '+t.substitutes.map(function(p){return MU.esc(p.player.name)}).join(", ")+'</span>':'')}).join("")+'</div></div>';
        }
        if(ev&&ev.length){
          html+='<div><h4>Events</h4><ul class="events">'+ev.filter(function(e){return e.type==="Goal"||e.type==="Card"||e.type==="subst"}).map(function(e){var t=e.type==="Goal"?"⚽ "+(e.detail==="Own Goal"?"(og) ":e.detail==="Penalty"?"(pen) ":"")+MU.esc(e.player.name)+(e.assist&&e.assist.name?" <span style='color:var(--muted)'>("+MU.esc(e.assist.name)+")</span>":""):e.type==="Card"?(/Red/.test(e.detail)?"🟥 ":"🟨 ")+MU.esc(e.player.name):"↔ "+MU.esc(e.assist&&e.assist.name||"")+" for "+MU.esc(e.player.name); return '<li><span class="min">'+e.time.elapsed+(e.time.extra?"+"+e.time.extra:"")+"'</span>"+t+' <span style="color:var(--muted)">'+MU.esc(e.team.name)+'</span></li>'}).join("")+'</ul></div>';
        }
        box.innerHTML=html||"";
      });
    }).catch(function(){box.innerHTML=""});
  }
})();
</script></body></html>
