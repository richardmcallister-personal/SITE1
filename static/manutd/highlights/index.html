<style>
.hlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 18px;margin-top:6px}
.dec{grid-column:1/-1;margin:14px 0 -6px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:6px}
.dec:first-child{margin-top:0}
.hl .box{position:relative;aspect-ratio:16/9;background:var(--black);border-radius:8px;overflow:hidden}
.hl .play{all:unset;position:absolute;inset:0;cursor:pointer;display:block}
.hl .play img{width:100%;height:100%;object-fit:cover;display:block}
.hl .play .pb{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--red)}
.hl .play .pb::after{content:"";position:absolute;left:24px;top:18px;border-left:18px solid var(--on-black);border-top:12px solid transparent;border-bottom:12px solid transparent}
.hl .play:hover .pb,.hl .play:focus-visible .pb{transform:scale(1.07)}
.hl .play:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
.hl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hl .meta{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin-top:8px;font-size:13px}
.hl .meta a.s{font-weight:700;color:var(--ink)}
.hl .meta .tr{color:var(--red-ink);font-weight:600;font-size:12px}
.hl .t{font-weight:600;line-height:1.35;margin-top:3px}
.hl .by{font-size:12px;color:var(--muted);margin-top:2px}
.hl .by a{color:var(--muted)}

  <h2>Highlights</h2>

<script src="/manutd/mu.js"></script>
<script>
(function(){
  MU.nav("Highlights");
  var $=function(id){return document.getElementById(id)}, sp=function(x){return x.replace("-","–")};
  var ERAS=[["all","Every era"],["2020","2020s"],["2010","2010s"],["2000","2000s"],["1990","1990s"],["old","Before 1990"]], era="all", V=[];
  function eraOf(id){var y=parseInt(id,10); return y>=1990?String(Math.floor(y/10)*10):"old"}
  function decade(id){var y=parseInt(id,10); return y<1990?"Before 1990":Math.floor(y/10)*10+"s"}
  function render(){
    var list=V.filter(function(s){return era==="all"||eraOf(s.id)===era}), last=null, out="";
    list.forEach(function(s){var v=s.video, d=decade(s.id);
      if(d!==last){last=d; out+='<h3 class="dec">'+d+'</h3>'}
      out+='<article class="hl" data-v="'+MU.esc(v.id)+'"><div class="box"><button class="play" type="button" aria-label="Play: '+MU.esc(v.title)+'"><img src="https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg" alt="" loading="lazy" decoding="async"><span class="pb" aria-hidden="true"></span></button></div>'+
        '<div class="meta"><a class="s" href="/manutd/history/season/?s='+s.id+'">'+sp(s.id)+'</a><span class="tr">'+s.trophies.map(MU.esc).join(" · ")+'</span></div>'+
        '<div class="t">'+MU.esc(v.title)+'</div><div class="by">'+(v.by?MU.esc(v.by)+' · ':'')+'<a href="https://www.youtube.com/watch?v='+encodeURIComponent(v.id)+'" target="_blank" rel="noopener">Watch on YouTube</a></div></article>'});
    $("grid").innerHTML=out||'<p class="sub">No videos for this era yet.</p>';
    $("eras").innerHTML=ERAS.map(function(e){var n=V.filter(function(s){return e[0]==="all"||eraOf(s.id)===e[0]}).length; return '<button type="button" data-e="'+e[0]+'"'+(e[0]===era?' aria-pressed="true" class="on"':' aria-pressed="false"')+'>'+e[1]+' <b>('+n+')</b></button>'}).join("");
  }
  $("eras").addEventListener("click",function(ev){var b=ev.target.closest("button"); if(!b)return; era=b.dataset.e; render()});
  $("grid").addEventListener("click",function(ev){var b=ev.target.closest(".play"); if(!b)return; var art=b.closest(".hl"), id=art.dataset.v, t=art.querySelector(".t").textContent;
    document.querySelectorAll(".hl iframe").forEach(function(f){var a=f.closest(".hl"); f.remove(); a.querySelector(".play").hidden=false});
    b.hidden=true;
    var f=document.createElement("iframe"); f.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0"; f.title=t; f.allow="autoplay; encrypted-media; picture-in-picture; web-share; fullscreen"; f.setAttribute("allowfullscreen",""); f.referrerPolicy="strict-origin-when-cross-origin";
    art.querySelector(".box").appendChild(f)});
  fetch("/manutd/history/seasons.json").then(function(r){return r.json()}).then(function(S){
    V=S.filter(function(s){return s.video&&s.video.provider==="youtube"}).sort(function(a,b){return a.id<b.id?1:-1});
    $("note").textContent=V.length+" videos, one per trophy season, newest first. Each opens in place; the season link leads to the write-up and the full results.";
    render();
  }).catch(function(){$("grid").innerHTML='<p class="sub">Couldn\'t load the video list.</p>'});
})();
</script></body></html>
